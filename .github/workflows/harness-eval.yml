name: Harness regression

# 安全契约是 main 规则集的必需检查，必须对每个 PR 报告结果；
# 真实模型评测仍只在下列路径变化时运行，由 changes 任务判定。
on:
  pull_request:
  push:
    branches: [main, work/m1-baseline-ci]
  workflow_dispatch:
    inputs:
      approve_model_budget:
        description: '明确批准所选冻结套件的真实模型调用预算'
        type: boolean
        default: false
      profile:
        type: choice
        options: [config-check, preflight, smoke, dev, release, full-functional]
        default: config-check
      endpoint_mode:
        description: '显式选择 standard 标准 API 或 coding_plan 套餐端点；不自动切换'
        type: choice
        options: [standard, coding_plan]
        default: standard

permissions:
  contents: read

concurrency:
  group: harness-${{ github.event_name == 'workflow_dispatch' && (inputs.profile == 'config-check' && 'configuration' || 'paid') || github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  configuration:
    name: No-model configuration check
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Classify configuration without model calls
        env:
          LLM_BASE_URL: ${{ secrets.HARNESS_LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.HARNESS_LLM_MODEL }}
          HARNESS_KEY_CONFIGURED: ${{ secrets.HARNESS_LLM_API_KEY != '' }}
          ENDPOINT_MODE: ${{ inputs.endpoint_mode || 'standard' }}
          PROFILE: ${{ inputs.profile }}
        run: python3 -m scripts.eval.endpoint_config --endpoint-mode "$ENDPOINT_MODE" --profile "$PROFILE"

  changes:
    name: Detect model evaluation scope
    if: github.event_name != 'workflow_dispatch' || inputs.profile != 'config-check'
    runs-on: ubuntu-latest
    outputs:
      model: ${{ steps.scope.outputs.model }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          args=()
          if [ "$EVENT" = workflow_dispatch ]; then args+=(--all); fi
          python -m scripts.ci.scope --base "$BASE" "${args[@]}" --github-output "$GITHUB_OUTPUT"


  safety-contracts:
    name: Offline safety contracts
    if: github.event_name != 'workflow_dispatch' || inputs.profile != 'config-check'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LLM_API_KEY: ''
      LLM_BASE_URL: http://127.0.0.1:1/v1
      EMBEDDING_BASE_URL: http://127.0.0.1:1/v1
      DATA_DIR: /tmp/voyacart-contracts
      REDIS_URL: ''
      LANGFUSE_SECRET_KEY: ''
      LANGFUSE_PUBLIC_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
      - name: Install Redis for deterministic infrastructure contracts
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: uv sync --frozen
      - name: Safety contracts without model credentials
        run: uv run python -m scripts.eval.harness run --profile contracts --output eval/verification/ci-contracts
      - name: Preserve contract report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          path: eval/verification/ci-contracts
          retention-days: 30

  model-scope:
    name: Real model scope and authorization
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - env:
          AFFECTED: ${{ needs.changes.outputs.model }}
          AUTHORIZED: ${{ github.event_name == 'workflow_dispatch' && inputs.approve_model_budget }}
        run: |
          echo "Model-affecting scope: $AFFECTED; explicit budget approval: $AUTHORIZED" >> "$GITHUB_STEP_SUMMARY"
          if [ "$AFFECTED" = true ] && [ "$AUTHORIZED" != true ]; then
            echo 'Real model validation BLOCKED: dispatch with budget approval after reviewing the frozen suite. Offline checks do not replace this gate.' >> "$GITHUB_STEP_SUMMARY"
          fi

  model-evaluation:
    name: Real model evaluation
    needs: [changes, safety-contracts, configuration]
    if: needs.changes.outputs.model == 'true' && github.event_name == 'workflow_dispatch' && inputs.profile != 'config-check' && inputs.approve_model_budget
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      LLM_BASE_URL: ${{ secrets.HARNESS_LLM_BASE_URL }}
      LLM_API_KEY: ${{ secrets.HARNESS_LLM_API_KEY }}
      LLM_MODEL: ${{ vars.HARNESS_LLM_MODEL }}
      ENDPOINT_MODE: ${{ inputs.endpoint_mode || 'standard' }}
      LLM_FALLBACK_MODEL: ''
      REDIS_URL: ''
      LANGFUSE_SECRET_KEY: ''
      LANGFUSE_PUBLIC_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
      - run: uv sync --frozen
      - name: Install Redis for model-run safety contracts
        if: inputs.profile != 'preflight'
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - name: Check explicit model configuration
        run: |
          if [ -z "$LLM_API_KEY" ] || [ -z "$LLM_BASE_URL" ] || [ -z "$LLM_MODEL" ]; then
            echo 'Missing HARNESS_LLM_API_KEY / HARNESS_LLM_BASE_URL secrets or HARNESS_LLM_MODEL variable.' >&2
            exit 2
          fi
      - name: Model identity and tool round-trip preflight
        if: env.LLM_MODEL == 'glm-5.3-flash' || inputs.profile == 'preflight'
        run: |
          suite_args=()
          if [ "$LLM_MODEL" = glm-5.3-flash ]; then
            case "$ENDPOINT_MODE" in
              standard) suite_args+=(--suite eval/harness/v1/glm-5.3-flash-suite.json) ;;
              coding_plan) suite_args+=(--suite eval/harness/v1/glm-5.3-flash-coding-plan-suite.json) ;;
              *) exit 2 ;;
            esac
          fi
          uv run python -m scripts.model_preflight "${suite_args[@]}" --output eval/verification/ci-preflight
      - name: Real model evaluation
        if: inputs.profile != 'preflight'
        env:
          HARNESS_PROFILE: ${{ inputs.profile == 'full-functional' && 'dev' || inputs.profile || 'smoke' }}
        run: |
          suite_args=()
          if [ "$LLM_MODEL" = glm-5.3-flash ]; then
            case "$ENDPOINT_MODE" in
              standard) suite_args+=(--suite eval/harness/v1/glm-5.3-flash-suite.json) ;;
              coding_plan) suite_args+=(--suite eval/harness/v1/glm-5.3-flash-coding-plan-suite.json) ;;
              *) exit 2 ;;
            esac
          fi
          if [ "$HARNESS_PROFILE" = release ]; then
            uv run python -m scripts.eval.harness run "${suite_args[@]}" --profile release --output eval/verification/ci-model --require-benefit
          else
            uv run python -m scripts.eval.harness run "${suite_args[@]}" --profile "$HARNESS_PROFILE" --output eval/verification/ci-model
          fi
          uv run python -m scripts.eval.harness verify eval/verification/ci-model
      - name: Validate full-functional development stage
        if: inputs.profile == 'full-functional'
        run: |
          case "$ENDPOINT_MODE" in
            standard) suite=eval/harness/v1/glm-5.3-flash-suite.json ;;
            coding_plan) suite=eval/harness/v1/glm-5.3-flash-coding-plan-suite.json ;;
            *) exit 2 ;;
          esac
          uv run python -m scripts.eval.harness.functional --suite "$suite" --prior eval/verification --output eval/verification/full-functional-dev.json
      - name: Preserve HTML and raw failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-model-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            eval/verification/ci-model
            eval/verification/ci-preflight
            eval/verification/full-functional-dev.json
          retention-days: 30

  full-functional-holdout:
    name: Full functional holdout (no cost-benefit claim)
    needs: model-evaluation
    if: github.event_name == 'workflow_dispatch' && inputs.profile == 'full-functional' && inputs.approve_model_budget
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      LLM_BASE_URL: ${{ secrets.HARNESS_LLM_BASE_URL }}
      LLM_API_KEY: ${{ secrets.HARNESS_LLM_API_KEY }}
      LLM_MODEL: ${{ vars.HARNESS_LLM_MODEL }}
      ENDPOINT_MODE: ${{ inputs.endpoint_mode || 'standard' }}
      LLM_FALLBACK_MODEL: ''
      REDIS_URL: ''
      LANGFUSE_SECRET_KEY: ''
      LANGFUSE_PUBLIC_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
      - run: uv sync --frozen
      - name: Install Redis for holdout safety contracts
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - name: Download this run and attempt's development evidence
        uses: actions/download-artifact@v4
        with:
          name: harness-model-${{ github.run_id }}-${{ github.run_attempt }}
          path: eval/verification/full-functional-prior
      - name: Freeze selected suite
        id: suite
        run: |
          case "$ENDPOINT_MODE" in
            standard) suite=eval/harness/v1/glm-5.3-flash-suite.json ;;
            coding_plan) suite=eval/harness/v1/glm-5.3-flash-coding-plan-suite.json ;;
            *) exit 2 ;;
          esac
          echo "path=$suite" >> "$GITHUB_OUTPUT"
      - name: Verify prior stage before any holdout model request
        env:
          SUITE: ${{ steps.suite.outputs.path }}
        run: uv run python -m scripts.eval.harness.functional --suite "$SUITE" --prior eval/verification/full-functional-prior
      - name: Complete frozen holdout functionality
        env:
          SUITE: ${{ steps.suite.outputs.path }}
        run: |
          uv run python -m scripts.eval.harness run --suite "$SUITE" --profile release --output eval/verification/ci-model
          uv run python -m scripts.eval.harness verify eval/verification/ci-model
      - name: Summarize functionality separately from cost benefit
        if: always()
        env:
          SUITE: ${{ steps.suite.outputs.path }}
        run: uv run python -m scripts.eval.harness.functional --suite "$SUITE" --prior eval/verification/full-functional-prior --holdout eval/verification/ci-model --output eval/verification/full-functional-summary.json
      - name: Preserve all stage evidence and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-full-functional-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            eval/verification/ci-model
            eval/verification/full-functional-prior
            eval/verification/full-functional-summary.json
          retention-days: 30
